name: link
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Core Logic & DI
  provider: ^6.1.1
  get_it: ^7.6.7
  injectable: ^2.3.2
  dartz: ^0.10.1

  # Networking
  dio: ^5.3.3
  retrofit: ^4.1.0

  # Data & Models
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  shared_preferences: ^2.2.2

  # UI & Animation
  rive: ^0.14.0
  auto_size_widget: ^0.0.4
  flutter_svg: ^2.0.10+1
  progress_state_button: ^1.0.4
  qr_flutter: ^4.1.0
  web_smooth_scroll: ^1.1.0
  awesome_snackbar_content: ^0.1.3
  flutter_animated_dialog: ^2.0.1

  # Utils
  logging: ^1.1.1
  firebase_core: ^2.31.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  injectable_generator: ^2.5.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/rive/
  fonts:
    - family: Horizon
      fonts:
        - asset: assets/fonts/Horizon.ttf
    - family: Despairs
      fonts:
        - asset: assets/fonts/Despairs.ttf
    - family: Atomed
      fonts:
        - asset: assets/fonts/Atomed.otf
    - family: RobotReavers
      fonts:
        - asset: assets/fonts/RobotReavers.ttf
    - family: Circular
      fonts:
        - asset: assets/fonts/Circular.otf
    - family: CircularB
      fonts:
        - asset: assets/fonts/CircularB.otf
